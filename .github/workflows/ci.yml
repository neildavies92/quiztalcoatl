name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg and ffprobe
        timeout-minutes: 5
        shell: bash
        run: |
          # The hosted runner's Azure mirror repeatedly stalled FFmpeg downloads.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -E -i \
              's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Synchronise locked dependencies
        run: uv sync --locked
      - run: make check
      - run: make smoke

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image
        run: make docker-build
      - name: Container static checks and tests
        run: make docker-check
      - name: Offline runtime, bind mounts and H.264 smoke
        run: make docker-smoke
