name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Synchronise locked dependencies
        run: uv sync --locked
      - run: make check
      - run: make smoke
